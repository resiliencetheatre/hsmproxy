# Replace identity paths, reader/serial/key ID, peer pin, and physical IPs.
# This file is deliberately not runnable until real identities are configured.
[identity]
name = site-a
pkcs11_module = /usr/lib/x86_64-linux-gnu/opensc-pkcs11.so
token_serial = REPLACE_SERIAL
reader = REPLACE_EXACT_PCSC_READER
key_id_hex = 01
certificate = /etc/hsmproxy/site-a.pub.pem

[peer]
name = site-b
public_key = /etc/hsmproxy/site-b.pub.pem
spki_sha256 = REPLACE_WITH_64_HEX_DIGITS

[local]
listen_address = 127.0.0.2
target_address = 127.0.0.1
video_port = 5000
audio_port = 5002
text_port = 5004

[tunnel]
role = initiator
bind = 192.0.2.10:5500
peer = 192.0.2.20:5500
max_payload = 1400
